name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  qml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install Quickshell and a headless compositor
        run: pacman -Syu --noconfirm --needed quickshell qt6-declarative qt6-svg qt6-5compat sway grim inter-font git
      - uses: actions/checkout@v4
      - name: Load, screenshot and lint the shell
        run: tools/ci/qml-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qml-artifacts
          path: artifacts/
